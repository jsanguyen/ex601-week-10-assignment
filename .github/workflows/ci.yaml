name: CI # the name shown in the Actions tab

on: # TRIGGERS: what starts a run
  push: # run on every push, to any branch, automatically
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab for manual runs

permissions:
  contents: read # least privilege: the job only needs to read the code

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest # GitHub creates a fresh Linux machine
    timeout-minutes: 10 # stop a hung run instead of burning Actions minutes
    steps: # steps run in order; first failure stops the run
      - name: Check out code
        uses: actions/checkout@v7 # step 1: copy the repo onto it

      - name: Set up Python
        uses: actions/setup-python@v7 # step 2: install Python
        with:
          python-version: '3.12'
          cache: pip # reuse downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt # step 3: install the pinned test tools

      - name: Run tests
        run: pytest -v # step 4: THE GATE - run the tests, one line per test.
        # one failing test fails this step,
        # which turns the whole run red.
